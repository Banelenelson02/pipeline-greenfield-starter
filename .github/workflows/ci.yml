name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: set up Java 21 (actions/setup-java@v4, temurin distribution)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # TODO: run `mvn test` from the app/ directory
      - working-directory: app
        run: mvn test
  build-jar:
    runs-on: ubuntu-latest
    # TODO: needs: run-tests
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      # TODO: set up Java 21 again (each job runs on a fresh machine)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # TODO: run `mvn package -DskipTests` from app/
      - working-directory: app
        run: mvn package -DskipTests
      # TODO: upload target/*-jar-with-dependencies.jar as an artifact
      #       (actions/upload-artifact@v4)
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app/target/*-jar-with-dependencies.jar
  build-docker-image:
    runs-on: ubuntu-latest
    # TODO: needs: build-jar
    needs: build-jar
    steps:
      - uses: actions/checkout@v4
      # TODO: docker build -t pipeline-greenfield ./app
      - run: docker build -t pipeline-greenfield ./app
  diagnose-failure:
    runs-on: ubuntu-latest
    needs: [ run-tests, build-jar, build-docker-image ]
    if: failure()
    steps:
      # TODO: this is the new part, not in the session. Write a short,
      # human-readable explanation of what likely broke and why into
      # $GITHUB_STEP_SUMMARY. It doesn't need to be clever — even checking
      # needs.run-tests.result / needs.build-jar.result / etc and echoing a
      # plain-English guess is enough. See BRIEF.md for the idea.
      - name: Explain what broke
        run: |
          echo "### Failure diagnosis" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.run-tests.result }}" == "failure" ]; then
            echo "Tests failed — check OrderTotalTest assertions against OrderTotal.java logic." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-jar.result }}" == "failure" ]; then
            echo "Jar build failed — check pom.xml and the mvn package step." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-docker-image.result }}" == "failure" ]; then
            echo "Docker image failed to build — check app/Dockerfile." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Something